# -----------------------------------------------------------------------------
# Panne déversée — section tournée d'un angle β (versage)
# β = 0° → identique Panne ; β = 90° → identique PanneAplomb
# -----------------------------------------------------------------------------
[[config_calcul]]
id_config_calcul = "PANNE_DEVERSEE"
type_poutre       = "PanneDeversee"
usage             = "panne_standard"

L_min_m           = 2.0
L_max_m           = 8.0
pas_longueur_m    = 0.25

pente_deg         = [45]
entraxe_m         = [1.2]
classe_service    = 1

g_k_kNm2          = [0.40]
g2_k_kNm2         = 0.17
q_k_kNm2          = 0.0
categorie_q       = "H"
s_k_kNm2          = 0.36
w_k_kNm2          = 0.0

double_flexion             = true
fleches_double             = true   # calcul bi-axe ELS flèche (implicite si double_flexion=true)
contre_fleche_mm           = 0.0    # pré-cambrure à soustraire de w_fin et w_2 [mm]
second_oeuvre              = true
entraxe_antideversement_mm = 0.0
longueur_appui_mm          = 50.0

# Surcharge limites flèche (facultatif — sinon valeurs de limites_fleche_ec5.csv)
# limite_fleche_inst = 300.0   # Winst(Q) ≤ L/300
# limite_fleche_fin  = 200.0   # Wnet,fin ≤ L/200
# limite_fleche_2    = 500.0   # Wtot,2   ≤ L/500

  [[config_calcul.filtres]]
  champ     = "classe_resistance"
  operateur = "in"
  valeur    = ["C24","GT24", "GL24h"]



# -----------------------------------------------------------------------------
# Solive de plancher — chargement vertical, pas de pente
# -----------------------------------------------------------------------------
[[config_calcul]]
id_config_calcul = "SOLIVE_PLANCHER"
type_poutre       = "Solive"
usage             = "plancher_courant"

L_min_m           = 2.0
L_max_m           = 6.0
pas_longueur_m    = 0.25

pente_deg         = 0.0
entraxe_m         = [0.60]
classe_service    = 1

g_k_kNm2          = 0.60       # chape + revêtement
g2_k_kNm2         = 0.17       # cloisons légères (charge fragile)
q_k_kNm2          = 1.50       # habitation (catégorie A)
categorie_q       = "A"
s_k_kNm2          = 0.0
w_k_kNm2          = 0.0

second_oeuvre              = true
longueur_appui_mm          = 50.0
entraxe_antideversement_mm = 0.0

  [[config_calcul.filtres]]
  champ     = "classe_resistance"
  operateur = "in"
  valeur    = ["C24","GT24"]

