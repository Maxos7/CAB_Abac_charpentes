# configs_calcul_vect.toml — Configurations de calcul EC5
# Référence complète : modeles_config.md
# CLI : uv run abac-vect --toml configs_calcul_vect.toml --stock stock.csv
# Champs multi-valués (liste) → produit cartésien automatique.

# -----------------------------------------------------------------------------
# Panne déversée avec second œuvre
# -----------------------------------------------------------------------------
[[config_calcul]]
id_config_calcul = "PANNE_DEVERSEE_W2"
type_poutre       = "PanneDeversee"
usage             = "panne_standard"

L_min_m           = 2.0
L_max_m           = 12
pas_longueur_m    = 0.25

pente_deg         = [40]
entraxe_m         = [1.2]
classe_service    = 1

g_k_kNm2          = [0.40]
g2_k_kNm2         = [0.17]
q_k_kNm2          = 0.0
categorie_q       = "H"
s_k_kNm2          = 0.36
w_k_kNm2          = 0.0

double_flexion             = true
fleches_double             = true
contre_fleche_mm           = 0.0
second_oeuvre              = true
entraxe_antideversement_mm = 0.0
longueur_appui_mm          = 50.0

# limite_fleche_inst = 300.0
# limite_fleche_fin  = 200.0
# limite_fleche_2    = 500.0

# -----------------------------------------------------------------------------
# Panne déversée sans second œuvre
# -----------------------------------------------------------------------------
[[config_calcul]]
id_config_calcul = "PANNE_DEVERSEE"
type_poutre       = "PanneDeversee"
usage             = "panne_standard"

L_min_m           = 2.0
L_max_m           = 12
pas_longueur_m    = 0.25

pente_deg         = [40]
entraxe_m         = [1.2]
classe_service    = 1

g_k_kNm2          = [0.40]
g2_k_kNm2         = [0]
q_k_kNm2          = 0.0
categorie_q       = "H"
s_k_kNm2          = 0.36
w_k_kNm2          = 0.0

double_flexion             = true
fleches_double             = true
contre_fleche_mm           = 0.0
second_oeuvre              = false
entraxe_antideversement_mm = 0.0
longueur_appui_mm          = 50.0

# -----------------------------------------------------------------------------
# Solive de plancher avec second œuvre
# -----------------------------------------------------------------------------
[[config_calcul]]
id_config_calcul = "SOLIVE_PLANCHER_W2"
type_poutre       = "Solive"
usage             = "plancher_courant"

L_min_m           = 2.0
L_max_m           = 6.0
pas_longueur_m    = 0.25

pente_deg         = 0.0
entraxe_m         = [0.60]
classe_service    = 1

g_k_kNm2          = 0.60   # chape + revêtement
g2_k_kNm2         = 0.17   # cloisons légères
q_k_kNm2          = 1.50   # habitation catégorie A
categorie_q       = "A"
s_k_kNm2          = 0.0
w_k_kNm2          = 0.0

second_oeuvre              = true
longueur_appui_mm          = 50.0
entraxe_antideversement_mm = 0.0
