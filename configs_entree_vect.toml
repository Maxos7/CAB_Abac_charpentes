# configs_entree_vect.toml — Ingestion CSV stock pour le calcul
# Référence complète : modeles_config.md
# CLI : uv run abac-vect --toml-calcul configs_calcul_vect.toml --toml-entree configs_entree_vect.toml

[filtrage]
# Appliqué après mappage_colonnes. Repli : lignes avec classe_resistance non nulle.
colonne = "statut_filtre"
valeur  = "retenu"

[section]
# Valeurs valides : "rectangle" (défaut) | "rond" | "custom"
colonne_forme    = "forme_section"
colonne_diametre = "d_mm"

[mappage_colonnes]
# Colonnes de stock_charpente.csv (généré par sapeg_regen_stock)
b_mm              = "b_mm"
h_mm              = "h_mm"
classe_resistance = "classe_resistance"
id_produit        = "id_produit"
libelle           = "libelle"
statut_filtre     = "statut_filtre"
L_max_m           = "L_max_m"
# statut_ingestion = "statut_ingestion"   # absent de stock_charpente.csv
# forme_section    = "forme_section"      # absent → fallback "rectangle"
# d_mm             = "d_mm"              # absent

# Renommage anti-conflit : "famille" du CSV masquerait celle de materiaux_bois.csv
famille_stock = "famille"
