[tool.uv.workspace]
members = [
    "src/abac_charpente_vectoriser",
    "src/sapeg_regen_stock",
]

[tool.uv.sources]
sapeg-regen-stock = { workspace = true }
abac-charpente-vectoriser = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests de performance (exclure avec -m 'not slow')",
]

[tool.coverage.run]
source = ["src"]
