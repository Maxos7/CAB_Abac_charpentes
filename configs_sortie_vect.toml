# =============================================================================
# configs_sortie_vect.toml
# Configuration des exports dérivés depuis abaque_complet_global.csv
#
# Usage CLI :
#   uv run abac-vect   (configs_sortie_vect.toml chargé automatiquement)
#   uv run abac-vect --toml-sortie autre_configs_sortie.toml
#
# Chaque [[vue]] produit un fichier CSV indépendant.
#
# Types disponibles :
#   agregation  — longueur max admissible par groupe [agrégation]
#                 Champs obligatoires : groupby (liste de colonnes)
#                 Champs optionnels  : colonnes, trier_par, filtres
#   filtre      — sélection de lignes + colonnes sans agrégation
#                 Champs optionnels  : colonnes, trier_par, filtres
#
# Colonnes calculées automatiquement par l'agrégation :
#   longueur_max_admissible_m  — portée max vérifiée (taux_global ≤ 1.0)
#   verif_determinante         — vérification au taux le plus élevé
#   taux_determinant           — valeur de ce taux
#
# Opérateurs de filtres :
#   egal, different, inferieur, superieur, inferieur_egal, superieur_egal,
#   contient (sous-chaîne, insensible à la casse), in (liste de valeurs)
# =============================================================================


### ── Vue Questionnaire ────────────────────────────────────────────────────────────
# Produit un CSV fusionné (une ligne par couple config × article) destiné au
# logiciel externe de comparaison TypeForms.
#
# Correspondance des colonnes avec les tableaux docs/Structure Form.md :
#
#   Données comparaison questionnaire :
#     type_poutre             → type_poutre
#     pente_deg               → Pente (°)
#     g_k_kNm2                → G permanente  ⚠ unité kN/m² (× 100 = daN/m²)
#     entraxe_m               → Entraxe (m)
#     longueur_max_admissible_m → Portée (m)
#     essence                 → à venir : colonne dédiée ajoutée dans sapeg_regen_stock
#                               (pour l'instant encodée dans `libelle`)
#
#   Données complémentaires — liste articles :
#     id_produit              → Code Sapeg
#     taux_determinant        → Indice de classement (à ne pas afficher)
#     b_mm                    → Base (mm)
#     h_mm                    → Hauteur (mm)
#     longueur_max_article_m  → Longueur_article (m)  [longueur commerciale]
#     classe_resistance       → Classe de résistance
#     libelle                 → Commentaire  (contient aussi l'essence)
#     csl_valide              → article disponible pour cette portée (auto-calculé)

[[vue]]
nom            = "questionnaire"
description    = "Format questionnaire — comparaison TypeForms + liste articles"
fichier_sortie = "abaque_questionnaire.csv"
type           = "agregation"
groupby        = ["id_config_calcul", "id_produit"]
colonnes       = [
    # ── Données pour comparaison questionnaire ────────────────────────────────
    "type_poutre",
    "pente_deg",                  # Pente (°)
    "g_k_kNm2",                   # G permanente (kN/m²) — ×100 → daN/m²
    "entraxe_m",                  # Entraxe (m)
    "longueur_max_admissible_m",  # Portée max admissible (m)
    # "essence",                  # Essence — colonne à venir (sapeg_regen_stock)
    # ── Données complémentaires — liste articles ──────────────────────────────
    "id_produit",                 # Code Sapeg
    "taux_determinant",           # Indice de classement (à ne pas afficher)
    "b_mm",                       # Base (mm)
    "h_mm",                       # Hauteur (mm)
    "longueur_max_article_m",     # Longueur article commercial (m)
    "classe_resistance",          # Classe de résistance
    "libelle",                    # Commentaire + essence (ex. "épicéa C24 45×120")
    "csl_valide",                 # Portée ≤ longueur commerciale de l'article
]
trier_par      = ["id_config_calcul", "taux_determinant"]

