# configs_sortie_vect.toml — Exports CSV depuis abaque_complet_global.csv
# Référence complète : modeles_config.md
# CLI : uv run abac-vect --toml-sortie configs_sortie_vect.toml

# Score composite [0 ; 1] — faible = article le plus économique/adapté.
# Poids à 0 pour désactiver un critère ; actif = false pour supprimer la colonne.
[indice_de_classement]
actif           = true
poids_section   = 1.0
poids_longueur  = 1.0
poids_classe    = 1.0

ordre_classes_resistance = [
    "C18", "C24", "C27", "C30", "C35", "C40", "C45", "C50",
    "GL24h", "GL24c", "GL28h", "GL28c", "GL32h", "GL32c"
]


# ── Vue Questionnaire ─────────────────────────────────────────────────────────
[[vue]]
nom            = "questionnaire"
description    = "Format questionnaire — comparaison TypeForms + liste articles"
fichier_sortie = "abaque_questionnaire.csv"
type           = "filtre"
colonnes       = [
    "type_poutre", "pente_deg", "g_k_kNm2", "g2_k_kNm2",
    "entraxe_m", "longueur_m", "essence",
    "id_produit", "b_mm", "h_mm", "longueur_max_article_m",
    "classe_resistance", "indice_de_classement"
]
trier_par      = ["indice_de_classement"]
# cles_groupe       = ["type_poutre", "pente_deg", "g_k_kNm2", "entraxe_m", "longueur_m", "essence"]
# limite_par_groupe = 10

  [[vue.filtres]]
  champ     = "verifie"
  operateur = "egal"
  valeur    = "True"


# ── Vue calcul vérifiée (sans doublons article) ───────────────────────────────
[[vue]]
nom              = "verification calcul"
description      = "Toutes portées vérifiées par section × config — sans doublons article"
fichier_sortie   = "verification_calcul.csv"
type             = "filtre"
exclure_colonnes = ["id_produit", "libelle", "essence", "longueur_max_article_m", "indice_de_classement"]
deduplicer       = true
colonnes         = []
trier_par        = ["type_poutre", "pente_deg", "entraxe_m", "longueur_m"]